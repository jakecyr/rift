[project]
name = "jevcode"
version = "0.1.0"
description = "Coding agent that lets a frontier model write and Jev decide."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "typesafe-sdk>=0.7.2,<0.8",
]

[project.scripts]
jevcode = "jevcode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
